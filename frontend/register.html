<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NEMS - Exam Session Registration">
  <title>NEMS — Exam Registration</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page-wrapper">
    <div id="nav-container"></div>

    <main class="container">
      <div class="page-header">
        <h1 id="page-title">Exam Registration</h1>
        <p id="page-desc">Register for upcoming examination sessions</p>
      </div>

      <div id="alert-container"></div>

      <div class="content-grid">
        <!-- Registration Form (Hidden for Admin) -->
        <div id="registration-section">
          <h2 class="section-title">📝 Register for Exam</h2>
          <div class="card form-section">
            <form id="register-form">
              <div class="form-group" id="student-select-group" style="display: none;">
                <label>Student <span class="required">*</span></label>
                <select id="student_id">
                  <option value="">Select student</option>
                </select>
              </div>

              <div class="form-group">
                <label>Exam <span class="required">*</span></label>
                <select id="exam_code" required>
                  <option value="">Loading exams...</option>
                </select>
              </div>

              <div class="form-group">
                <label>Session <span class="required">*</span></label>
                <select id="session_id" required disabled>
                  <option value="">Select an exam first</option>
                </select>
              </div>

              <button type="submit" class="btn btn-primary" id="submit-btn" style="width: 100%;">
                Confirm Registration
              </button>
            </form>
          </div>
        </div>

        <!-- Management / Lookup Section -->
        <div>
          <h2 class="section-title" id="list-title">🔍 My Registrations</h2>
          <div class="card">
            <div class="search-bar" id="admin-lookup" style="display: none; margin-bottom: 1rem;">
              <input type="number" id="lookup-id" placeholder="Specific Student ID" style="max-width: 200px;">
              <button class="btn btn-secondary" onclick="lookupRegistrations()">Search</button>
              <button class="btn btn-outline" onclick="loadAllRegistrations()" style="margin-left: 0.5rem;">View All</button>
            </div>
            <div id="lookup-result">
              <div class="empty-state"><p>No records found</p></div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p>NEMS — National Examination Management System &copy; 2026</p>
    </footer>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.getElementById('nav-container').innerHTML = getNavHTML('register.html');

    const role = auth.getRole();
    const studentId = auth.getStudentId();
    
    if (role === 'admin') {
      document.getElementById('registration-section').style.display = 'none';
      document.getElementById('admin-lookup').style.display = 'flex';
      document.getElementById('list-title').textContent = '📋 Manage Registrations';
      document.getElementById('page-desc').textContent = 'View and manage all student examination registrations';
      loadAllRegistrations();
    } else {
      loadExams();
      lookupRegistrations(studentId);
    }

    async function loadExams() {
      try {
        const exams = await api.get('/exams');
        populateSelect('exam_code', exams, 'EXAM_CODE',
          item => `${item.EXAM_NAME} (${item.EXAM_CODE})`,
          'Select exam'
        );
      } catch (err) { console.error(err); }
    }

    document.getElementById('exam_code').addEventListener('change', async (e) => {
      const examCode = e.target.value;
      const sessionSelect = document.getElementById('session_id');
      if (!examCode) return;
      try {
        const sessions = await api.get(`/exams/${examCode}/sessions`);
        sessionSelect.disabled = false;
        populateSelect('session_id', sessions, 'SESSION_ID',
          item => `${item.PHASE} — ${item.SHIFT} — ${formatDate(item.EXAM_DATE)}`,
          'Select session'
        );
      } catch (err) { console.error(err); }
    });

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const data = {
          student_id: parseInt(studentId),
          session_id: parseInt(document.getElementById('session_id').value)
        };
        const result = await api.post('/register', data);
        showAlert('alert-container', result.message, 'success');
        lookupRegistrations(studentId);
      } catch (err) { showAlert('alert-container', err.message, 'error'); }
    });

    async function loadAllRegistrations() {
      try {
        const registrations = await api.get('/registrations');
        renderRegistrations(registrations);
      } catch (err) { console.error(err); }
    }

    async function lookupRegistrations(id) {
      const sid = id || document.getElementById('lookup-id').value;
      if (!sid) return;
      try {
        const registrations = await api.get(`/registrations/${sid}`);
        renderRegistrations(registrations);
      } catch (err) { console.error(err); }
    }

    function renderRegistrations(list) {
      const container = document.getElementById('lookup-result');
      if (list.length === 0) {
        container.innerHTML = '<div class="empty-state"><p>No registrations found.</p></div>';
        return;
      }
      container.innerHTML = `
        <div class="table-wrapper animate-in">
          <table>
            <thead>
              <tr>
                ${role === 'admin' ? '<th>Student</th>' : ''}
                <th>Exam</th>
                <th>Session</th>
                <th>Date</th>
                ${role === 'admin' ? '<th>Action</th>' : ''}
              </tr>
            </thead>
            <tbody>
              ${list.map(r => `
                <tr>
                  ${role === 'admin' ? `<td><strong>${r.STUDENT_ID}</strong><br><small>${r.FIRST_NAME} ${r.LAST_NAME}</small></td>` : ''}
                  <td><strong>${r.EXAM_NAME}</strong></td>
                  <td>#${r.SESSION_ID}</td>
                  <td>${formatDate(r.EXAM_DATE)}</td>
                  ${role === 'admin' ? `
                    <td>
                      <button class="btn btn-outline" onclick="deleteRegistration(${r.STUDENT_ID}, ${r.SESSION_ID})" 
                              style="color: var(--error); border-color: var(--error); padding: 0.25rem 0.5rem; font-size: 0.8rem;">
                        Delete
                      </button>
                    </td>
                  ` : ''}
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>`;
    }

    async function deleteRegistration(sid, ssid) {
      if (!confirm(`Remove registration for student ${sid} from session ${ssid}?`)) return;
      try {
        await api.delete(`/registrations/${sid}/${ssid}`);
        showAlert('alert-container', 'Registration deleted successfully', 'success');
        if (document.getElementById('lookup-id').value) {
          lookupRegistrations();
        } else {
          loadAllRegistrations();
        }
      } catch (err) { showAlert('alert-container', err.message, 'error'); }
    }
  </script>
  </script>
</body>
</html>
