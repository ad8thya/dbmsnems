<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | NEMS</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .signup-container {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-2xl) var(--space-xl);
            min-height: calc(100vh - 100px);
        }
        .signup-card {
            width: 100%;
            max-width: 800px;
            padding: var(--space-2xl);
            animation: fadeIn 0.5s ease;
        }
        .signup-header {
            text-align: center;
            margin-bottom: var(--space-2xl);
        }
    </style>
</head>
<body class="page-wrapper">
    <header class="header">
        <div class="container">
            <a href="login.html" class="logo">
                <div class="logo-icon">🎓</div>
                NEMS
            </a>
        </div>
    </header>

    <main class="signup-container">
        <div class="card signup-card">
            <div class="signup-header">
                <h1>Student Registration</h1>
                <p>Create your NEMS account to register for examinations</p>
            </div>

            <form id="signupForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>First Name <span class="required">*</span></label>
                        <input type="text" id="fname" required>
                    </div>
                    <div class="form-group">
                        <label>Last Name <span class="required">*</span></label>
                        <input type="text" id="lname" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Email Address <span class="required">*</span></label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-group">
                        <label>Date of Birth <span class="required">*</span></label>
                        <input type="date" id="dob" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Street Address <span class="required">*</span></label>
                    <input type="text" id="street" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>City <span class="required">*</span></label>
                        <input type="text" id="city" required>
                    </div>
                    <div class="form-group">
                        <label>State <span class="required">*</span></label>
                        <input type="text" id="state" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Category <span class="required">*</span></label>
                        <select id="category" required>
                            <option value="">Select Category</option>
                            <option value="General">General</option>
                            <option value="OBC">OBC</option>
                            <option value="SC">SC</option>
                            <option value="ST">ST</option>
                            <option value="EWS">EWS</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Exam Center <span class="required">*</span></label>
                        <select id="center" required>
                            <option value="">Loading centers...</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Phone Numbers (comma separated)</label>
                    <input type="text" id="phones" placeholder="9876543210, 8765432109">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Password <span class="required">*</span></label>
                        <input type="password" id="password" required>
                    </div>
                    <div class="form-group">
                        <label>Confirm Password <span class="required">*</span></label>
                        <input type="password" id="confirm_password" required>
                    </div>
                </div>

                <div id="alertContainer"></div>

                <div style="display: flex; gap: var(--space-md); margin-top: var(--space-xl);">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Create Account</button>
                    <a href="login.html" class="btn btn-secondary" style="flex: 1;">Back to Login</a>
                </div>
            </form>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script>
        // Use a flag to avoid checkAuth redirect while on signup page
        // But api.js already handles this by checking pathname

        // Load centers
        async function loadCenters() {
            try {
                const centers = await api.get('/students/centers/list');
                populateSelect('center', centers, 'CENTER_ID', (c) => `${c.CENTER_NAME} (${c.CENTER_CITY})`);
            } catch (err) {
                console.error('Failed to load centers:', err.message);
            }
        }
        loadCenters();

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm_password').value;

            if (password !== confirm) {
                showAlert('alertContainer', 'Passwords do not match', 'error');
                return;
            }

            const payload = {
                first_name: document.getElementById('fname').value,
                last_name: document.getElementById('lname').value,
                email: document.getElementById('email').value,
                dob: document.getElementById('dob').value,
                street: document.getElementById('street').value,
                city: document.getElementById('city').value,
                state: document.getElementById('state').value,
                category: document.getElementById('category').value,
                center_id: document.getElementById('center').value,
                phone_numbers: document.getElementById('phones').value.split(',').map(p => p.trim()),
                password: password
            };

            try {
                const res = await api.post('/auth/signup', payload);
                if (res.success) {
                    showAlert('alertContainer', `Registration successful! Your Student ID is ${res.student_id}. Redirecting to login...`, 'success');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 3000);
                }
            } catch (err) {
                showAlert('alertContainer', err.message, 'error');
            }
        });
    </script>
</body>
</html>
