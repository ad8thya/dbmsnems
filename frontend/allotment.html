<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NEMS - Seat Allotment Results">
  <title>NEMS — Seat Allotment</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page-wrapper">
    <div id="nav-container"></div>

    <main class="container">
      <div class="page-header">
        <h1 id="page-title">Seat Allotment</h1>
        <p id="page-desc">Check your college and branch allotment status</p>
      </div>

      <div id="alert-container"></div>

      <!-- Admin Update Section -->
      <div id="admin-update" style="display: none; margin-bottom: 2rem;">
        <h2 class="section-title">🏛️ Assign / Update Allotment</h2>
        <div class="card">
          <form id="allotment-update-form" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--space-md); align-items: end;">
            <div class="form-group">
              <label>Student ID</label>
              <input type="number" id="up-student-id" required>
            </div>
            <div class="form-group">
              <label>Round #</label>
              <input type="number" id="up-round" required>
            </div>
            <div class="form-group">
              <label>Branch Code</label>
              <input type="text" id="up-branch" required>
            </div>
            <div class="form-group">
              <label>College Code</label>
              <input type="text" id="up-college" required>
            </div>
            <div class="form-group">
              <label>Category</label>
              <input type="text" id="up-category" required>
            </div>
            <button type="submit" class="btn btn-primary">Save Allotment</button>
          </form>
        </div>
      </div>

      <!-- Search Section (Admin) -->
      <div id="admin-search" style="display: none; margin-bottom: 2rem;">
        <h2 class="section-title">🔍 Search Allotments</h2>
        <div class="card" style="max-width: 500px;">
          <div class="search-bar">
            <input type="number" id="search-id" placeholder="Student ID">
            <button class="btn btn-secondary" onclick="searchAllotment()">Search</button>
          </div>
        </div>
      </div>

      <!-- Results Display -->
      <div id="allotment-display">
        <div id="student-info" style="display: none; margin-bottom: 1.5rem;">
          <h3 id="display-name"></h3>
        </div>
        <div id="allotment-results-container">
          <div class="empty-state"><p>No allotment records found.</p></div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p>NEMS — National Examination Management System &copy; 2026</p>
    </footer>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.getElementById('nav-container').innerHTML = getNavHTML('allotment.html');

    const role = auth.getRole();
    const studentId = auth.getStudentId();

    if (role === 'admin') {
      document.getElementById('page-title').textContent = 'Allotment Control';
      document.getElementById('page-desc').textContent = 'Manage student seat allotments and counselling rounds';
      document.getElementById('admin-update').style.display = 'block';
      document.getElementById('admin-search').style.display = 'block';
    } else {
      searchAllotment(studentId);
    }

    async function searchAllotment(id) {
      const sid = id || document.getElementById('search-id').value;
      if (!sid) return;

      const container = document.getElementById('allotment-results-container');
      try {
        const allotments = await api.get(`/allotments/${sid}`);
        if (allotments.length === 0) {
          container.innerHTML = '<div class="empty-state"><p>No allotment found for this student.</p></div>';
          return;
        }

        document.getElementById('student-info').style.display = 'block';
        document.getElementById('display-name').textContent = `Allotment for ${allotments[0].FIRST_NAME} ${allotments[0].LAST_NAME}`;

        container.innerHTML = `
          <div class="table-wrapper animate-in">
            <table>
              <thead>
                <tr><th>Round</th><th>College</th><th>Branch</th><th>Status</th></tr>
              </thead>
              <tbody>
                ${allotments.map(a => `
                  <tr>
                    <td><strong>Round ${a.ROUND_NO}</strong></td>
                    <td><strong>${a.COLLEGE_NAME}</strong> (${a.COLLEGE_CITY})</td>
                    <td>${a.BRANCH_NAME}</td>
                    <td>${statusBadge(a.STATUS)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>`;
      } catch (err) {
        container.innerHTML = `<div class="empty-state"><p>${err.message}</p></div>`;
      }
    }

    document.getElementById('allotment-update-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        student_id: parseInt(document.getElementById('up-student-id').value),
        round_no: parseInt(document.getElementById('up-round').value),
        branch_code: document.getElementById('up-branch').value,
        college_id: parseInt(document.getElementById('up-college').value),
        allocated_category: document.getElementById('up-category').value,
        status: 'Confirmed'
      };

      try {
        await api.post('/allotments', payload);
        showAlert('alert-container', 'Allotment updated successfully', 'success');
        searchAllotment(payload.student_id);
      } catch (err) {
        showAlert('alert-container', err.message, 'error');
      }
    });
  </script>
</body>
</html>
