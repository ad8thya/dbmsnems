<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NEMS - Student Registration and Management">
  <title>NEMS — Student Management</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page-wrapper">
    <div id="nav-container"></div>

    <main class="container">
      <div class="page-header">
        <h1 id="page-title">Student Management</h1>
        <p id="page-desc">View and manage records for all students</p>
      </div>

      <div id="alert-container"></div>

      <div id="admin-view" style="display: none;">
        <h2 class="section-title">👥 All Registered Students</h2>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">Total access to student directory. Administrators can verify details or delete inactive accounts if necessary.</p>
        <div id="students-table-container">
          <div class="empty-state"><p>Loading students...</p></div>
        </div>
      </div>

      <div id="student-view" style="display: none;">
        <h2 class="section-title">👤 Personal Profile</h2>
        <div id="profile-container"></div>
      </div>
    </main>

    <footer class="footer">
      <p>NEMS — National Examination Management System &copy; 2026</p>
    </footer>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.getElementById('nav-container').innerHTML = getNavHTML('students.html');

    const role = auth.getRole();
    if (role === 'admin') {
      document.getElementById('admin-view').style.display = 'block';
      loadCenters();
      loadStudents();
    } else {
      document.getElementById('page-title').textContent = 'My Profile';
      document.getElementById('page-desc').textContent = 'View and verify your registration details';
      document.getElementById('student-view').style.display = 'block';
      loadProfile();
    }

    async function loadCenters() {
      const centers = await api.get('/students/centers/list');
      populateSelect('center_id', centers, 'CENTER_ID', item => `${item.CENTER_NAME} (${item.CENTER_CITY})`);
    }

    async function loadStudents() {
      try {
        const students = await api.get('/students');
        const container = document.getElementById('students-table-container');
        if (students.length === 0) {
          container.innerHTML = '<div class="empty-state"><p>No students found</p></div>';
          return;
        }
        container.innerHTML = `
          <div class="table-wrapper">
            <table>
              <thead>
                <tr><th>ID</th><th>Name</th><th>Email</th><th>Actions</th></tr>
              </thead>
              <tbody>
                ${students.map(s => `
                  <tr>
                    <td><strong>${s.STUDENT_ID}</strong></td>
                    <td>${s.FIRST_NAME} ${s.LAST_NAME}</td>
                    <td>${s.EMAIL}</td>
                    <td><button class="btn btn-danger btn-sm" onclick="deleteStudent(${s.STUDENT_ID})">Delete</button></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>`;
      } catch (err) { console.error(err); }
    }

    async function loadProfile() {
      try {
        const students = await api.get('/students'); // Backend filters this to current student
        const container = document.getElementById('profile-container');
        
        if (!students || students.length === 0) {
          container.innerHTML = `
            <div class="card animate-in" style="text-align: center; padding: 3rem;">
              <div style="font-size: 3rem; margin-bottom: 1rem;">👤</div>
              <p style="color: var(--text-muted);">Profile data not found. Please ensure you are logged in correctly.</p>
              <button onclick="auth.logout()" class="btn btn-outline" style="margin-top: 1rem;">Logout and Re-login</button>
            </div>`;
          return;
        }

        const s = students[0];
        container.innerHTML = `
          <div class="card animate-in">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-xl);">
              <div>
                <p style="color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase;">Student ID</p>
                <p style="font-size: 1.2rem; font-weight: 700; margin-bottom: var(--space-md);">${s.STUDENT_ID}</p>
                
                <p style="color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase;">Full Name</p>
                <p style="font-size: 1.1rem; margin-bottom: var(--space-md);">${s.FIRST_NAME} ${s.LAST_NAME}</p>
                
                <p style="color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase;">Email</p>
                <p style="margin-bottom: var(--space-md);">${s.EMAIL}</p>
              </div>
              <div>
                <p style="color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase;">Category</p>
                <p style="margin-bottom: var(--space-md);"><span class="badge badge-blue">${s.CATEGORY}</span></p>
                
                <p style="color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase;">Exam Center</p>
                <p style="margin-bottom: var(--space-md);">${s.CENTER_NAME || 'Not Assigned'}</p>
                
                <p style="color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase;">Phone Numbers</p>
                <p>${(s.PHONE_NUMBERS && s.PHONE_NUMBERS.length > 0) ? s.PHONE_NUMBERS.join(', ') : 'No Phone Number'}</p>
              </div>
            </div>
          </div>`;
      } catch (err) { console.error(err); }
    }

    async function deleteStudent(id) {
      if (confirm('Delete this account?')) {
        await api.delete(`/students/${id}`);
        loadStudents();
      }
    }
  </script>
</body>
</html>
