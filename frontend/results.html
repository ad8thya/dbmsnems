<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NEMS - View Examination Results">
  <title>NEMS — Results</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page-wrapper">
    <div id="nav-container"></div>

    <main class="container">
      <div class="page-header">
        <h1 id="page-title">Examination Results</h1>
        <p id="page-desc">View your academic performance</p>
      </div>

      <div id="alert-container"></div>

      <!-- Admin Update Section -->
      <div id="admin-update" style="display: none; margin-bottom: 2rem;">
        <h2 class="section-title">✍️ Update Student Result</h2>
        <div class="card">
          <form id="result-update-form" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--space-md); align-items: end;">
            <div class="form-group">
              <label>Student ID</label>
              <input type="number" id="update-student-id" required>
            </div>
            <div class="form-group">
              <label>Session ID</label>
              <input type="number" id="update-session-id" required>
            </div>
            <div class="form-group">
              <label>Score</label>
              <input type="number" id="update-score" required>
            </div>
            <div class="form-group">
              <label>Percentile</label>
              <input type="number" step="0.01" id="update-percentile" required>
            </div>
            <button type="submit" class="btn btn-primary">Update Result</button>
          </form>
        </div>
      </div>

      <!-- Admin Search Section -->
      <div id="admin-search" style="display: none; margin-bottom: 2rem;">
        <h2 class="section-title">🔍 Search Student Results</h2>
        <div class="card" style="max-width: 500px;">
          <div class="search-bar">
            <input type="number" id="search-id" placeholder="Enter Student ID">
            <button class="btn btn-secondary" onclick="searchResults()">Search</button>
          </div>
        </div>
      </div>

      <!-- Results Display -->
      <div id="results-display">
        <div id="student-info" style="display: none; margin-bottom: 1.5rem;">
          <h3 id="display-name"></h3>
        </div>
        <div id="results-table-container">
          <div class="empty-state"><p>No results to display</p></div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p>NEMS — National Examination Management System &copy; 2026</p>
    </footer>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.getElementById('nav-container').innerHTML = getNavHTML('results.html');

    const role = auth.getRole();
    const studentId = auth.getStudentId();

    if (role === 'admin') {
      document.getElementById('page-title').textContent = 'Results Management';
      document.getElementById('page-desc').textContent = 'Input and manage student examination results';
      document.getElementById('admin-update').style.display = 'block';
      document.getElementById('admin-search').style.display = 'block';
    } else {
      searchResults(studentId);
    }

    async function searchResults(id) {
      const sid = id || document.getElementById('search-id').value;
      if (!sid) return;

      const container = document.getElementById('results-table-container');
      try {
        const results = await api.get(`/results/${sid}`);
        if (results.length === 0) {
          container.innerHTML = '<div class="empty-state"><p>No results found for this student.</p></div>';
          return;
        }

        document.getElementById('student-info').style.display = 'block';
        document.getElementById('display-name').textContent = `Results for ${results[0].FIRST_NAME} ${results[0].LAST_NAME} (ID: ${results[0].STUDENT_ID})`;

        container.innerHTML = `
          <div class="table-wrapper animate-in">
            <table>
              <thead>
                <tr>
                  <th>Exam</th>
                  <th>Session</th>
                  <th>Date</th>
                  <th>Score</th>
                  <th>Percentile</th>
                </tr>
              </thead>
              <tbody>
                ${results.map(r => `
                  <tr>
                    <td><strong>${r.EXAM_NAME}</strong></td>
                    <td>${r.SESSION_ID}</td>
                    <td>${formatDate(r.EXAM_DATE)}</td>
                    <td><strong style="color: var(--accent-blue-light);">${r.SCORE} / ${r.TOTAL_MARKS}</strong></td>
                    <td><span class="badge badge-green">${r.PERCENTILE}</span></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>`;
      } catch (err) {
        container.innerHTML = `<div class="empty-state"><p>${err.message}</p></div>`;
      }
    }

    document.getElementById('result-update-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        student_id: parseInt(document.getElementById('update-student-id').value),
        session_id: parseInt(document.getElementById('update-session-id').value),
        score: parseInt(document.getElementById('update-score').value),
        percentile: parseFloat(document.getElementById('update-percentile').value)
      };

      try {
        await api.post('/results', payload);
        showAlert('alert-container', 'Result updated successfully', 'success');
        searchResults(payload.student_id);
      } catch (err) {
        showAlert('alert-container', err.message, 'error');
      }
    });
  </script>
</body>
</html>
