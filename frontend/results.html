<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NEMS - View Examination Results">
  <title>NEMS — Results</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page-wrapper">
    <div id="nav-container"></div>

    <main class="container">
      <div class="page-header">
        <h1>Examination Results</h1>
        <p>Look up results by Student ID</p>
      </div>

      <div id="alert-container"></div>

      <!-- Search Section -->
      <div class="card" style="max-width: 600px; margin-bottom: 2rem;">
        <h2 class="section-title">🔍 Search Results</h2>
        <div class="search-bar">
          <input type="number" id="student-id" placeholder="Enter Student ID (e.g. 1001)">
          <button class="btn btn-primary" onclick="searchResults()">Search</button>
        </div>
      </div>

      <!-- Student Info -->
      <div id="student-info" style="display: none; margin-bottom: 2rem;">
        <div class="card" style="max-width: 600px;">
          <div style="display: flex; align-items: center; gap: 1rem;">
            <div style="width: 56px; height: 56px; background: var(--gradient-primary); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 1.5rem;">
              👤
            </div>
            <div>
              <h3 id="student-name" style="margin-bottom: 0.25rem;"></h3>
              <p style="color: var(--text-secondary); font-size: 0.9rem;" id="student-detail"></p>
            </div>
          </div>
        </div>
      </div>

      <!-- Results Table -->
      <div id="results-container">
        <div class="empty-state">
          <div class="empty-icon">📊</div>
          <p>Enter a Student ID to view results</p>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p>NEMS — National Examination Management System &copy; 2026</p>
    </footer>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.getElementById('nav-container').innerHTML = getNavHTML('results.html');

    // Allow Enter key to trigger search
    document.getElementById('student-id').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') searchResults();
    });

    async function searchResults() {
      const studentId = document.getElementById('student-id').value.trim();
      if (!studentId) {
        showAlert('alert-container', 'Please enter a Student ID', 'error');
        return;
      }

      const container = document.getElementById('results-container');
      const infoDiv = document.getElementById('student-info');
      container.innerHTML = '<div class="empty-state"><div class="spinner"></div><p>Loading results...</p></div>';

      try {
        const results = await api.get(`/results/${studentId}`);

        // Show student info
        infoDiv.style.display = 'block';
        document.getElementById('student-name').textContent = 
          `${results[0].FIRST_NAME} ${results[0].LAST_NAME}`;
        document.getElementById('student-detail').textContent = 
          `Student ID: ${results[0].STUDENT_ID}`;

        // Show results table
        container.innerHTML = `
          <div class="table-wrapper animate-in">
            <table>
              <thead>
                <tr>
                  <th>Exam</th>
                  <th>Session</th>
                  <th>Phase / Shift</th>
                  <th>Exam Date</th>
                  <th>Score</th>
                  <th>Total</th>
                  <th>Percentage</th>
                  <th>Percentile</th>
                </tr>
              </thead>
              <tbody>
                ${results.map(r => {
                  const pct = ((r.SCORE / r.TOTAL_MARKS) * 100).toFixed(1);
                  return `
                    <tr>
                      <td><strong>${r.EXAM_NAME}</strong></td>
                      <td>${r.SESSION_ID}</td>
                      <td>${r.PHASE} / ${r.SHIFT}</td>
                      <td>${formatDate(r.EXAM_DATE)}</td>
                      <td><strong style="color: var(--accent-blue-light);">${r.SCORE}</strong></td>
                      <td>${r.TOTAL_MARKS}</td>
                      <td>${pct}%</td>
                      <td><span class="badge badge-green">${r.PERCENTILE}</span></td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>`;
      } catch (err) {
        infoDiv.style.display = 'none';
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">❌</div>
            <p>${err.message}</p>
          </div>`;
      }
    }
  </script>
</body>
</html>
